<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>一級建築士 勉強ノート 2026</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{font-family:'Yu Gothic','YuGothic','Meiryo',sans-serif;font-size:14px;line-height:1.75;color:#111;background:#f0f3f8;margin:0;padding-bottom:70px;}
.save-ind{position:fixed;top:8px;right:10px;z-index:999;background:rgba(30,140,30,.85);color:#fff;padding:3px 10px;border-radius:12px;font-size:11px;opacity:0;transition:opacity .3s;pointer-events:none;}
.save-ind.show{opacity:1;}
/* ── Sync widget ── */
.sync-widget{position:fixed;top:8px;left:10px;z-index:999;font-size:11px;color:#fff;background:rgba(80,80,80,.85);padding:3px 12px;border-radius:12px;pointer-events:none;}
.sync-widget.ok{background:rgba(20,110,50,.88);}
.sync-widget.err{background:rgba(160,40,40,.88);}
/* ── Toolbar ── */
.toolbar{position:fixed;bottom:0;left:0;right:0;z-index:200;background:#222;display:flex;gap:3px;padding:6px 8px;box-shadow:0 -2px 8px rgba(0,0,0,.4);}
.tb-btn{flex:1;padding:9px 4px;border:none;border-radius:5px;font-size:12px;font-family:inherit;font-weight:bold;cursor:pointer;text-align:center;color:#fff;white-space:nowrap;}
.btn-mode{background:#1a3c6e;}.btn-print{background:#2d7a2d;}
/* ── Nav ── */
.sticky-nav{position:sticky;top:0;z-index:100;background:#1a3c6e;display:flex;gap:2px;padding:5px 6px;overflow-x:auto;box-shadow:0 2px 6px rgba(0,0,0,.3);}
.nav-btn{flex:1;min-width:48px;padding:7px 6px;background:rgba(255,255,255,.18);color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:12.5px;font-family:inherit;font-weight:bold;white-space:nowrap;}
.nav-btn.active,.nav-btn:hover{background:rgba(255,255,255,.92);color:#1a3c6e;}
.nav-btn.img-tab{background:rgba(255,220,50,.25);}
.nav-btn.img-tab.active,.nav-btn.img-tab:hover{background:#ffd700;color:#333;}
/* ── Subject sections ── */
.subject-section{display:none;padding:14px 10px;max-width:900px;margin:0 auto;}
.subject-section.active{display:block;}
.subject-title{font-size:20px;font-weight:bold;border-bottom:3px solid;padding-bottom:8px;margin:0 0 14px;}
.subj-kankaku .subject-title{color:#2F5496;border-color:#2F5496;}
.subj-kankyo  .subject-title{color:#375623;border-color:#375623;}
.subj-hokki   .subject-title{color:#833C00;border-color:#833C00;}
.subj-kozo    .subject-title{color:#7030A0;border-color:#7030A0;}
.subj-seko    .subject-title{color:#1F3864;border-color:#1F3864;}
.subj-images  .subject-title{color:#7a5c00;border-color:#d4a000;}
/* ── Blocks ── */
.note-block{background:#fff;border-radius:8px;margin-bottom:12px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.1);}
.blk-hdr{color:#fff;padding:9px 14px;cursor:pointer;font-size:13.5px;font-weight:bold;display:flex;justify-content:space-between;align-items:center;user-select:none;}
.blk-hdr .ti{font-size:11px;opacity:.75;}
.subj-kankaku .blk-hdr{background:#2F5496;}.subj-kankaku .blk-hdr:hover{background:#3d6ab8;}
.subj-kankyo  .blk-hdr{background:#375623;}.subj-kankyo  .blk-hdr:hover{background:#4a7030;}
.subj-hokki   .blk-hdr{background:#833C00;}.subj-hokki   .blk-hdr:hover{background:#a04c00;}
.subj-kozo    .blk-hdr{background:#7030A0;}.subj-kozo    .blk-hdr:hover{background:#8840c0;}
.subj-seko    .blk-hdr{background:#1F3864;}.subj-seko    .blk-hdr:hover{background:#2c4f8a;}
.subj-images  .blk-hdr{background:#7a5c00;}.subj-images  .blk-hdr:hover{background:#9a7200;}
.blk-body{padding:10px 14px;}.blk-body.col{display:none;}
/* ── Item list ── */
.item-list{display:flex;flex-direction:column;gap:4px;min-height:4px;}
.item-row{display:flex;align-items:center;gap:6px;background:#f8faff;border:1px solid #c8d4e8;border-radius:5px;padding:5px 6px;transition:opacity .15s;}
.item-row.dragging{opacity:.4;box-shadow:0 4px 12px rgba(0,0,0,.2);}
.item-txt-input{flex:1;border:none;background:transparent;font-family:inherit;font-size:13px;line-height:1.6;outline:none;min-width:0;padding:2px 0;color:#111;}
.item-txt-input:focus{background:#fffde8;border-radius:3px;padding:2px 4px;}
.item-del-btn{background:none;border:none;color:#cc4444;font-size:18px;cursor:pointer;padding:2px 6px;flex-shrink:0;line-height:1;}
.item-del-btn:hover{color:#ff2222;}
.item-add-row{display:flex;gap:6px;margin-top:8px;}
.item-input{flex:1;padding:7px 10px;border:1.5px solid #c8d4e8;border-radius:5px;font-family:inherit;font-size:13px;background:#f8faff;color:#111;}
.item-input:focus{outline:2px solid #1a3c6e;background:#fff;}
.item-add-btn{background:#1a3c6e;color:#fff;border:none;padding:7px 16px;border-radius:5px;font-size:13px;font-family:inherit;cursor:pointer;flex-shrink:0;font-weight:bold;}
.item-add-btn:hover{background:#22508a;}
.item-empty-hint{color:#ccc;font-style:italic;font-size:12px;padding:4px 0;}
/* ── Rendered text ── */
.rendered .l0{margin:2px 0;padding:2px 0;border-bottom:1px solid #f0f0f0;}
.rendered .empty{color:#ccc;font-style:italic;font-size:12px;padding:8px 0;}
/* ── Image cards (edit) ── */
.img-add-row{margin-bottom:8px;}
.img-add-btn{background:#1a3c6e;color:#fff;border:none;padding:8px 18px;border-radius:5px;font-size:13px;font-family:inherit;cursor:pointer;}
.img-add-btn:hover{background:#22508a;}
.img-list{display:flex;flex-direction:column;gap:6px;}
.img-card{display:flex;align-items:center;gap:8px;background:#f8faff;border:1px solid #c8d4e8;border-radius:6px;padding:6px 8px;transition:opacity .15s;}
.img-card.dragging{opacity:.4;box-shadow:0 4px 12px rgba(0,0,0,.2);}
.drag-handle{font-size:20px;color:#bbb;cursor:grab;padding:0 4px;touch-action:none;user-select:none;-webkit-user-select:none;flex-shrink:0;line-height:1;}
.drag-handle:active{cursor:grabbing;color:#888;}
.img-thumb{width:56px;height:46px;object-fit:cover;border-radius:3px;border:1px solid #ddd;flex-shrink:0;background:#eee;}
.img-card-title{flex:1;font-size:12px;color:#333;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;}
.img-del{background:none;border:none;color:#cc4444;font-size:18px;cursor:pointer;padding:4px;flex-shrink:0;line-height:1;}
.img-del:hover{color:#ff2222;}
.img-empty-hint{color:#ccc;font-style:italic;font-size:12px;padding:6px 0;}
.img-uploading{color:#1a3c6e;font-size:12px;padding:6px 0;font-style:italic;}
/* ── Image view ── */
.mblk{margin-bottom:18px;}
.mtitle{font-size:12px;font-weight:bold;background:#fffbe8;padding:4px 10px;border-left:3px solid #d4a000;margin-bottom:6px;}
.mblk img{max-width:100%;border-radius:4px;border:1px solid #ddd;display:block;}
/* ── Mode control ── */
body.edit-mode .view-only{display:none!important;}
body.view-mode .edit-only{display:none!important;}
body.view-mode .blk-body.col{display:block!important;}
body.view-mode .note-block--empty{display:none!important;}
/* ── Mobile ── */
@media(max-width:600px){.subject-section{padding:10px 8px;}.nav-btn{padding:6px 3px;font-size:11px;min-width:40px;}}
/* ── Print ── */
@media print{
  @page{size:A4;margin:15mm 12mm 18mm 12mm;}
  body{font-size:9pt;line-height:1.6;color:#000!important;background:#fff!important;padding:0;}
  .toolbar,.sticky-nav,.save-ind,.sync-widget,.edit-only{display:none!important;}
  .subject-section{display:block!important;padding:0;max-width:none;}
  .blk-body,.blk-body.col{display:block!important;}
  .subject-section{page-break-before:always;}
  .subject-section:first-of-type{page-break-before:auto;}
  .note-block{box-shadow:none;border:1px solid #bbb;margin-bottom:6pt;border-radius:0;break-inside:avoid;}
  .note-block--empty{display:none!important;}
  .blk-hdr{padding:4pt 8pt;font-size:10pt;}.blk-hdr .ti{display:none;}
  .subj-kankaku .blk-hdr{background:#2F5496!important;}.subj-kankyo .blk-hdr{background:#375623!important;}
  .subj-hokki   .blk-hdr{background:#833C00!important;}.subj-kozo   .blk-hdr{background:#7030A0!important;}
  .subj-seko    .blk-hdr{background:#1F3864!important;}.subj-images .blk-hdr{background:#7a5c00!important;}
  .subject-title{font-size:14pt;color:#000!important;border-bottom:2pt solid #000!important;}
  .rendered .l0{color:#000!important;}
  .mblk{break-inside:avoid;}.mblk img{max-width:165mm;}
  .mtitle{background:#f5f5dc!important;}
  .item-add-row,.img-add-row,.img-empty-hint{display:none!important;}
  img{print-color-adjust:exact!important;-webkit-print-color-adjust:exact!important;}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
}
</style>
</head>
<body class="edit-mode">
<div class="save-ind" id="saveInd">保存済み ✓</div>
<div class="sync-widget" id="syncWidget">☁ 接続中...</div>
<div class="toolbar">
  <button class="tb-btn btn-mode" id="modeBtn" onclick="toggleMode()">👁 表示</button>
  <button class="tb-btn btn-print" onclick="window.print()">🖨 印刷</button>
</div>
<nav class="sticky-nav">
  <button class="nav-btn" data-id="kankaku" onclick="showSubj('kankaku',this)">計画</button>
  <button class="nav-btn" data-id="kankyo"  onclick="showSubj('kankyo',this)">環設</button>
  <button class="nav-btn" data-id="hokki"   onclick="showSubj('hokki',this)">法規</button>
  <button class="nav-btn" data-id="kozo"    onclick="showSubj('kozo',this)">構造</button>
  <button class="nav-btn" data-id="seko"    onclick="showSubj('seko',this)">施工</button>
  <button class="nav-btn img-tab" data-id="images" onclick="showSubj('images',this)">【画像】</button>
</nav>
<div id="content"></div>
<script>
'use strict';

// ── Firebase 初期化 ───────────────────────────────────
firebase.initializeApp({
  apiKey:            "AIzaSyAFlPk4rJNhYft4lc5TBM_b41x8P-v_Sss",
  authDomain:        "ikkyu2026-d1242.firebaseapp.com",
  projectId:         "ikkyu2026-d1242",
  storageBucket:     "ikkyu2026-d1242.firebasestorage.app",
  messagingSenderId: "771068476894",
  appId:             "1:771068476894:web:61fa9c2556c67349deb14f"
});
const fbDb = firebase.firestore();

let _syncBusy = false;

// テキストノート用ドキュメント
function notesRef() {
  return fbDb.collection('ikkyu2026').doc('notes');
}
// 画像データ用サブコレクション
function imgDocRef(id) {
  return fbDb.collection('ikkyu2026').doc('notes').collection('imgs').doc(id);
}

function setSyncWidget(text, cls) {
  const el = document.getElementById('syncWidget');
  if (!el) return;
  el.textContent = '☁ ' + text;
  el.className = 'sync-widget ' + (cls || '');
}

// ── Firestore テキスト同期 ─────────────────────────────
async function syncToFirestore() {
  if (_syncBusy) return;
  _syncBusy = true;
  try {
    data._updatedAt = Date.now();
    await notesRef().set({
      subjects:   data.subjects,
      imgMeta:    data.imgMeta,
      _updatedAt: data._updatedAt
    });
    setSyncWidget('同期済み', 'ok');
    const el = document.getElementById('saveInd');
    if (el) { el.classList.add('show'); setTimeout(() => el.classList.remove('show'), 1400); }
  } catch (e) {
    setSyncWidget('同期失敗', 'err');
    console.error('Firestore write:', e);
  }
  _syncBusy = false;
}

// ── Firestore 画像操作 ────────────────────────────────
async function uploadImgToFirestore(id, dataUrl) {
  await imgDocRef(id).set({ data: dataUrl, _updatedAt: Date.now() });
  await IDB.put(id, dataUrl); // ローカルキャッシュ
}

async function fetchImgData(id) {
  const cached = await IDB.get(id);
  if (cached) return cached;
  try {
    const snap = await imgDocRef(id).get();
    if (snap.exists) {
      const url = snap.data().data;
      await IDB.put(id, url);
      return url;
    }
  } catch (e) { console.error('fetchImg:', e); }
  return null;
}

async function deleteImgFromFirestore(id) {
  try { await imgDocRef(id).delete(); } catch (e) { console.error('deleteImg:', e); }
  await IDB.del(id);
}

// ── リアルタイム同期リスナー ──────────────────────────
function startSync() {
  setSyncWidget('接続中...', '');
  notesRef().onSnapshot(async snap => {
    if (!snap.exists) {
      // 初回: ローカルデータをクラウドへ
      await syncToFirestore();
      return;
    }
    const remote   = snap.data();
    const remoteTs = remote._updatedAt || 0;
    const localTs  = data._updatedAt   || 0;

    if (remoteTs > localTs) {
      // 他の端末の変更を反映
      data.subjects   = remote.subjects || {};
      data.imgMeta    = remote.imgMeta  || {};
      data._updatedAt = remoteTs;
      migrateData();
      localStorage.setItem(SKEY, JSON.stringify(data));
      await populateUI();
    }
    setSyncWidget('同期済み', 'ok');
  }, err => {
    setSyncWidget('接続エラー', 'err');
    console.error('onSnapshot:', err);
  });
}

// ── アプリ定数 ────────────────────────────────────────
const SUBJECTS = ['計画','環設','法規','構造','施工'];
const SUBJ_IDS = {計画:'kankaku',環設:'kankyo',法規:'hokki',構造:'kozo',施工:'seko'};
const SKEY = 'ikkyu2026';
const SECTIONS = [
  {id:'key',    icon:'📌', label:'キーポイント'},
  {id:'mis',    icon:'❌', label:'間違いノート'},
  {id:'themes', icon:'📖', label:'テーマメモ'},
  {id:'mock',   icon:'📝', label:'模擬試験見直し'},
];

let data = {subjects:{}, imgMeta:{}};

function migrateData() {
  for (const s of SUBJECTS) {
    if (!data.subjects[s]) data.subjects[s] = {};
    for (const sec of SECTIONS) {
      const v = data.subjects[s][sec.id];
      if (!Array.isArray(v)) {
        data.subjects[s][sec.id] = typeof v === 'string' && v.trim()
          ? v.split('\n').map(l => l.trim()).filter(l => l)
          : [];
      }
    }
    if (!data.imgMeta[s]) data.imgMeta[s] = [];
  }
}

function loadData() {
  try { const s = localStorage.getItem(SKEY); if (s) data = JSON.parse(s); } catch {}
  migrateData();
}

let _saveT = null;
function schedSave() {
  if (_saveT) clearTimeout(_saveT);
  _saveT = setTimeout(() => {
    localStorage.setItem(SKEY, JSON.stringify(data));
    syncToFirestore();
  }, 800);
}

// ── IndexedDB（画像ローカルキャッシュ）───────────────
const IDB = (() => {
  let _db = null;
  async function open() {
    if (_db) return _db;
    return new Promise((ok, fail) => {
      const r = indexedDB.open('ikkyu2026imgs', 1);
      r.onupgradeneeded = e => e.target.result.createObjectStore('imgs');
      r.onsuccess = e => { _db = e.target.result; ok(_db); };
      r.onerror = fail;
    });
  }
  async function put(k, v) {
    await open();
    return new Promise((ok, fail) => {
      const tx = _db.transaction('imgs','readwrite');
      tx.objectStore('imgs').put(v, k);
      tx.oncomplete = ok; tx.onerror = fail;
    });
  }
  async function get(k) {
    await open();
    return new Promise((ok, fail) => {
      const tx = _db.transaction('imgs','readonly');
      const r = tx.objectStore('imgs').get(k);
      r.onsuccess = e => ok(e.target.result); r.onerror = fail;
    });
  }
  async function del(k) {
    await open();
    return new Promise((ok, fail) => {
      const tx = _db.transaction('imgs','readwrite');
      tx.objectStore('imgs').delete(k);
      tx.oncomplete = ok; tx.onerror = fail;
    });
  }
  return {put, get, del};
})();

// ── UI 構築 ───────────────────────────────────────────
function buildUI() {
  const cont = document.getElementById('content');
  for (const s of SUBJECTS) {
    const sid = SUBJ_IDS[s];
    const div = document.createElement('div');
    div.id = sid;
    div.className = `subject-section subj-${sid}`;
    div.innerHTML = buildSubjHTML(s, sid);
    cont.appendChild(div);
  }
  const imgDiv = document.createElement('div');
  imgDiv.id = 'images';
  imgDiv.className = 'subject-section subj-images';
  imgDiv.innerHTML = buildImgTabHTML();
  cont.appendChild(imgDiv);
}

function buildSubjHTML(subj, sid) {
  const label = subj === '環設' ? '環境設備' : subj;
  let h = `<h1 class="subject-title">${label}</h1>`;
  for (const sec of SECTIONS) {
    const eid = `${sid}-${sec.id}`;
    h += `<div class="note-block">
  <div class="blk-hdr" onclick="toggleBlk(this)">${sec.icon} ${sec.label} <span class="ti">▼</span></div>
  <div class="blk-body col">
    <div class="edit-only">
      <div class="item-list" id="${eid}-list" data-subj="${subj}" data-field="${sec.id}"></div>
      <div class="item-add-row">
        <input class="item-input" id="${eid}-input" type="text" placeholder=""
          onkeydown="if(event.key==='Enter'){event.preventDefault();addItemFromInput('${subj}','${sec.id}',this);}">
        <button class="item-add-btn" onclick="addItemFromInput('${subj}','${sec.id}',document.getElementById('${eid}-input'))">追加</button>
      </div>
    </div>
    <div class="view-only rendered" id="${eid}-v"></div>
  </div></div>`;
  }
  return h;
}

function buildImgTabHTML() {
  let h = `<h1 class="subject-title">📊 まとめ画像</h1>`;
  for (const s of SUBJECTS) {
    const sid = SUBJ_IDS[s];
    h += `<div class="note-block">
  <div class="blk-hdr" onclick="toggleBlk(this)">${s} <span class="ti">▼</span></div>
  <div class="blk-body col">
    <div class="edit-only">
      <div class="img-add-row">
        <button class="img-add-btn" onclick="triggerAdd('${s}')">＋ 画像を追加</button>
        <input type="file" accept="image/*" id="img-input-${sid}" style="display:none" onchange="onImgAdd(this,'${s}')">
      </div>
      <div class="img-list" id="img-list-${sid}" data-subj="${s}"></div>
    </div>
    <div class="view-only" id="img-view-${sid}"></div>
  </div></div>`;
  }
  return h;
}

// ── ユーティリティ ────────────────────────────────────
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function setEl(id, html) { const el = document.getElementById(id); if (el) el.innerHTML = html; }

// ── テキスト項目処理 ──────────────────────────────────
function renderItemList(subj, field) {
  const sid = SUBJ_IDS[subj];
  const list = document.getElementById(`${sid}-${field}-list`);
  if (!list) return;
  const items = data.subjects[subj][field] || [];
  list.innerHTML = '';
  if (!items.length) {
    list.innerHTML = '<div class="item-empty-hint">（まだ項目がありません）</div>';
    return;
  }
  items.forEach((text, i) => {
    const row = document.createElement('div');
    row.className = 'item-row';
    row.dataset.idx = i;
    row.innerHTML = `<div class="drag-handle">⠿</div>
      <input class="item-txt-input" type="text" value="${esc(text)}"
        data-subj="${esc(subj)}" data-field="${esc(field)}" data-idx="${i}"
        onblur="onItemBlur(this)"
        onkeydown="onItemKeydown(event,this)">
      <button class="item-del-btn" onclick="delItem('${esc(subj)}','${esc(field)}',${i})">✕</button>`;
    list.appendChild(row);
  });
}

function syncViewMode(subj, field) {
  const sid = SUBJ_IDS[subj];
  const items = data.subjects[subj][field] || [];
  const html = items.length
    ? items.map(t => `<div class="l0">${esc(t)}</div>`).join('')
    : '<div class="empty">（まだ入力がありません）</div>';
  setEl(`${sid}-${field}-v`, html);
  const listEl = document.getElementById(`${sid}-${field}-list`);
  if (listEl) {
    const block = listEl.closest('.note-block');
    if (block) block.classList.toggle('note-block--empty', items.length === 0);
  }
}

function addItemFromInput(subj, field, inputEl) {
  const text = inputEl.value.trim();
  if (!text) return;
  if (!Array.isArray(data.subjects[subj][field])) data.subjects[subj][field] = [];
  data.subjects[subj][field].push(text);
  inputEl.value = '';
  renderItemList(subj, field);
  syncViewMode(subj, field);
  schedSave();
  inputEl.focus();
}

function onItemBlur(el) {
  const subj = el.dataset.subj, field = el.dataset.field, idx = parseInt(el.dataset.idx);
  const newText = el.value.trim();
  if (!newText) { el.value = data.subjects[subj][field][idx] || ''; return; }
  if (data.subjects[subj][field][idx] !== newText) {
    data.subjects[subj][field][idx] = newText;
    syncViewMode(subj, field);
    schedSave();
  }
}

function onItemKeydown(e, el) {
  if (e.key === 'Enter')  { e.preventDefault(); el.blur(); }
  if (e.key === 'Escape') {
    el.value = data.subjects[el.dataset.subj][el.dataset.field][parseInt(el.dataset.idx)] || '';
    el.blur();
  }
}

function delItem(subj, field, idx) {
  data.subjects[subj][field].splice(idx, 1);
  renderItemList(subj, field);
  syncViewMode(subj, field);
  schedSave();
}

// ── 画像処理 ──────────────────────────────────────────
function triggerAdd(subj) {
  document.getElementById(`img-input-${SUBJ_IDS[subj]}`).click();
}

async function onImgAdd(input, subj) {
  const file = input.files[0];
  if (!file) return;
  const rawTitle = file.name.replace(/\.[^.]+$/, '');
  const title = prompt('画像のタイトルを入力してください', rawTitle);
  if (title === null) { input.value = ''; return; }

  const sid = SUBJ_IDS[subj];
  const list = document.getElementById(`img-list-${sid}`);
  if (list) list.innerHTML = '<div class="img-uploading">アップロード中...</div>';

  const dataUrl = await resizeImg(file);
  const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

  await uploadImgToFirestore(id, dataUrl);

  data.imgMeta[subj].push({id, title: title.trim() || rawTitle});
  await syncToFirestore();

  await renderImgCards(subj);
  await renderImgView(subj);

  // セクションを開く
  if (list) {
    const body = list.closest('.blk-body');
    if (body && body.classList.contains('col')) {
      body.classList.remove('col');
      const ti = body.previousElementSibling.querySelector('.ti');
      if (ti) ti.textContent = '▲';
    }
  }
  input.value = '';
}

async function resizeImg(file) {
  return new Promise(ok => {
    const img = new Image(), reader = new FileReader();
    reader.onload = e => {
      img.onload = () => {
        const MAX = 1200;
        let w = img.width, h = img.height;
        if (w > MAX || h > MAX) {
          if (w > h) { h = Math.round(h * MAX / w); w = MAX; }
          else { w = Math.round(w * MAX / h); h = MAX; }
        }
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        ok(c.toDataURL('image/jpeg', 0.85));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

async function delImg(subj, id) {
  if (!confirm('この画像を削除しますか？')) return;
  await deleteImgFromFirestore(id);
  data.imgMeta[subj] = data.imgMeta[subj].filter(m => m.id !== id);
  await syncToFirestore();
  await renderImgCards(subj);
  await renderImgView(subj);
}

async function renderImgCards(subj) {
  const sid = SUBJ_IDS[subj];
  const list = document.getElementById(`img-list-${sid}`);
  if (!list) return;
  list.innerHTML = '';
  const meta = data.imgMeta[subj] || [];
  if (!meta.length) {
    list.innerHTML = '<div class="img-empty-hint">（まだ画像がありません）</div>';
    return;
  }
  for (const m of meta) {
    const card = document.createElement('div');
    card.className = 'img-card';
    card.dataset.id = m.id;
    card.innerHTML = `
      <div class="drag-handle">⠿</div>
      <img class="img-thumb" src="" alt="" data-imgid="${esc(m.id)}">
      <div class="img-card-title">${esc(m.title)}</div>
      <button class="img-del" onclick="delImg('${subj}','${m.id}')">✕</button>`;
    list.appendChild(card);
    // 非同期で画像を読み込む
    fetchImgData(m.id).then(url => {
      if (url) {
        const imgEl = card.querySelector(`[data-imgid="${m.id}"]`);
        if (imgEl) imgEl.src = url;
      }
    });
  }
}

async function renderImgView(subj) {
  const sid = SUBJ_IDS[subj];
  const view = document.getElementById(`img-view-${sid}`);
  if (!view) return;
  const meta = data.imgMeta[subj] || [];
  if (!meta.length) { view.innerHTML = '<div class="empty rendered">（まだ画像がありません）</div>'; return; }
  view.innerHTML = meta.map(m =>
    `<div class="mblk"><div class="mtitle">${esc(m.title)}</div><img src="" data-imgid="${esc(m.id)}" alt="${esc(m.title)}"></div>`
  ).join('');
  // 非同期で画像を読み込む
  for (const m of meta) {
    fetchImgData(m.id).then(url => {
      if (url) view.querySelectorAll(`[data-imgid="${m.id}"]`).forEach(el => el.src = url);
    });
  }
}

// ── ドラッグ＆ドロップ ────────────────────────────────
let _drag = null, _dragMoved = false, _dragY0 = 0, _dragList = null, _dragCtx = null;

function initDragDrop() {
  document.addEventListener('pointerdown', e => {
    const handle = e.target.closest('.drag-handle');
    if (!handle) return;
    const card = handle.closest('.img-card');
    const row  = handle.closest('.item-row');
    _drag = card || row;
    if (!_drag) return;
    _dragList = _drag.parentNode;
    _dragCtx  = card
      ? {type:'img',  subj: _dragList.dataset.subj}
      : {type:'item', subj: _dragList.dataset.subj, field: _dragList.dataset.field};
    _dragY0 = e.clientY;
    _dragMoved = false;
    e.preventDefault();
  });

  document.addEventListener('pointermove', e => {
    if (!_drag) return;
    if (!_dragMoved) {
      if (Math.abs(e.clientY - _dragY0) < 5) return;
      _dragMoved = true;
      _drag.classList.add('dragging');
    }
    e.preventDefault();
    _drag.style.pointerEvents = 'none';
    const under = document.elementFromPoint(e.clientX, e.clientY);
    _drag.style.pointerEvents = '';
    const cls = _dragCtx.type === 'img' ? '.img-card' : '.item-row';
    const target = under?.closest(cls);
    if (target && target !== _drag && target.parentNode === _dragList) {
      const r = target.getBoundingClientRect();
      _dragList.insertBefore(_drag, e.clientY > r.top + r.height / 2 ? target.nextSibling : target);
    }
  }, {passive: false});

  document.addEventListener('pointerup', () => {
    if (!_drag) return;
    _drag.classList.remove('dragging');
    if (_dragMoved && _dragCtx) {
      if (_dragCtx.type === 'img') {
        const ids = [..._dragList.querySelectorAll('.img-card')].map(c => c.dataset.id);
        const map = {};
        (data.imgMeta[_dragCtx.subj] || []).forEach(m => map[m.id] = m);
        data.imgMeta[_dragCtx.subj] = ids.map(id => map[id]).filter(Boolean);
        schedSave();
        renderImgView(_dragCtx.subj);
      } else {
        const rows = [..._dragList.querySelectorAll('.item-row')];
        const old  = data.subjects[_dragCtx.subj][_dragCtx.field] || [];
        data.subjects[_dragCtx.subj][_dragCtx.field] =
          rows.map(r => old[parseInt(r.dataset.idx)]).filter(s => s !== undefined);
        schedSave();
        renderItemList(_dragCtx.subj, _dragCtx.field);
        syncViewMode(_dragCtx.subj, _dragCtx.field);
      }
    }
    _drag = null; _dragMoved = false; _dragList = null; _dragCtx = null;
  });

  document.addEventListener('pointercancel', () => {
    if (_drag) { _drag.classList.remove('dragging'); _drag = null; }
  });
}

// ── UI 操作 ───────────────────────────────────────────
function showSubj(id, btn) {
  document.querySelectorAll('.subject-section').forEach(e => e.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(e => e.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  btn.classList.add('active');
  localStorage.setItem('lastTab2026', id);
  window.scrollTo({top: 0, behavior: 'instant'});
}

function toggleBlk(hdr) {
  const body = hdr.nextElementSibling;
  const col = body.classList.toggle('col');
  hdr.querySelector('.ti').textContent = col ? '▼' : '▲';
}

let isEdit = true;
function toggleMode() {
  isEdit = !isEdit;
  document.body.className = isEdit ? 'edit-mode' : 'view-mode';
  document.getElementById('modeBtn').textContent = isEdit ? '👁 表示' : '✏️ 入力';
}

// ── データ投入 ────────────────────────────────────────
async function populateUI() {
  for (const s of SUBJECTS) {
    for (const sec of SECTIONS) {
      renderItemList(s, sec.id);
      syncViewMode(s, sec.id);
    }
  }
  for (const s of SUBJECTS) {
    await renderImgCards(s);
    await renderImgView(s);
  }
}

// ── 起動 ─────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', async () => {
  loadData();
  buildUI();
  initDragDrop();
  await IDB.get('__init__');
  await populateUI();
  const last = localStorage.getItem('lastTab2026') || 'kankaku';
  const btn = document.querySelector(`[data-id="${last}"]`);
  if (btn) showSubj(last, btn);
  startSync();
});
</script>
