<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>一級建築士 勉強ノート 2026</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{font-family:'Yu Gothic','YuGothic','Meiryo',sans-serif;font-size:14px;line-height:1.75;color:#111;background:#f0f3f8;margin:0;padding-bottom:70px;}
.save-ind{position:fixed;top:8px;right:10px;z-index:999;background:rgba(30,140,30,.85);color:#fff;padding:3px 10px;border-radius:12px;font-size:11px;opacity:0;transition:opacity .3s;pointer-events:none;}
.save-ind.show{opacity:1;}
/* ── Toolbar ── */
.toolbar{position:fixed;bottom:0;left:0;right:0;z-index:200;background:#222;display:flex;gap:3px;padding:6px 8px;box-shadow:0 -2px 8px rgba(0,0,0,.4);}
.tb-btn{flex:1;padding:9px 4px;border:none;border-radius:5px;font-size:12px;font-family:inherit;font-weight:bold;cursor:pointer;text-align:center;color:#fff;white-space:nowrap;}
.btn-mode{background:#1a3c6e;}.btn-exp{background:#6b3c00;}.btn-imp{background:#555;}
/* ── Nav ── */
.sticky-nav{position:sticky;top:0;z-index:100;background:#1a3c6e;display:flex;gap:2px;padding:5px 6px;overflow-x:auto;box-shadow:0 2px 6px rgba(0,0,0,.3);}
.nav-btn{flex:1;min-width:48px;padding:7px 6px;background:rgba(255,255,255,.18);color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:12.5px;font-family:inherit;font-weight:bold;white-space:nowrap;}
.nav-btn.active,.nav-btn:hover{background:rgba(255,255,255,.92);color:#1a3c6e;}
.nav-btn.img-tab{background:rgba(255,220,50,.25);}
.nav-btn.img-tab.active,.nav-btn.img-tab:hover{background:#ffd700;color:#333;}
/* ── Subject sections ── */
.subject-section{display:none;padding:14px 10px;max-width:900px;margin:0 auto;}
.subject-section.active{display:block;}
.subject-title{font-size:20px;font-weight:bold;border-bottom:3px solid;padding-bottom:8px;margin:0 0 14px;}
.subj-kankaku .subject-title{color:#2F5496;border-color:#2F5496;}
.subj-kankyo  .subject-title{color:#375623;border-color:#375623;}
.subj-hokki   .subject-title{color:#833C00;border-color:#833C00;}
.subj-kozo    .subject-title{color:#7030A0;border-color:#7030A0;}
.subj-seko    .subject-title{color:#1F3864;border-color:#1F3864;}
.subj-images  .subject-title{color:#7a5c00;border-color:#d4a000;}
/* ── Blocks ── */
.note-block{background:#fff;border-radius:8px;margin-bottom:12px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.1);}
.blk-hdr{color:#fff;padding:9px 14px;cursor:pointer;font-size:13.5px;font-weight:bold;display:flex;justify-content:space-between;align-items:center;user-select:none;}
.blk-hdr .ti{font-size:11px;opacity:.75;}
.subj-kankaku .blk-hdr{background:#2F5496;}.subj-kankaku .blk-hdr:hover{background:#3d6ab8;}
.subj-kankyo  .blk-hdr{background:#375623;}.subj-kankyo  .blk-hdr:hover{background:#4a7030;}
.subj-hokki   .blk-hdr{background:#833C00;}.subj-hokki   .blk-hdr:hover{background:#a04c00;}
.subj-kozo    .blk-hdr{background:#7030A0;}.subj-kozo    .blk-hdr:hover{background:#8840c0;}
.subj-seko    .blk-hdr{background:#1F3864;}.subj-seko    .blk-hdr:hover{background:#2c4f8a;}
.subj-images  .blk-hdr{background:#7a5c00;}.subj-images  .blk-hdr:hover{background:#9a7200;}
.blk-body{padding:10px 14px;}.blk-body.col{display:none;}
/* ── Item list（キーポイント・間違いノート・模擬試験）── */
.item-list{display:flex;flex-direction:column;gap:4px;min-height:4px;}
.item-row{display:flex;align-items:center;gap:6px;background:#f8faff;border:1px solid #c8d4e8;border-radius:5px;padding:5px 6px;transition:opacity .15s;}
.item-row.dragging{opacity:.4;box-shadow:0 4px 12px rgba(0,0,0,.2);}
.item-num{font-size:11px;color:#aaa;min-width:18px;text-align:right;flex-shrink:0;line-height:1.6;}
.item-txt-input{flex:1;border:none;background:transparent;font-family:inherit;font-size:13px;line-height:1.6;outline:none;min-width:0;padding:2px 0;color:#111;}
.item-txt-input:focus{background:#fffde8;border-radius:3px;padding:2px 4px;}
.item-del-btn{background:none;border:none;color:#cc4444;font-size:18px;cursor:pointer;padding:2px 6px;flex-shrink:0;line-height:1;}
.item-del-btn:hover{color:#ff2222;}
.item-add-row{display:flex;gap:6px;margin-top:8px;}
.item-input{flex:1;padding:7px 10px;border:1.5px solid #c8d4e8;border-radius:5px;font-family:inherit;font-size:13px;background:#f8faff;color:#111;}
.item-input:focus{outline:2px solid #1a3c6e;background:#fff;}
.item-add-btn{background:#1a3c6e;color:#fff;border:none;padding:7px 16px;border-radius:5px;font-size:13px;font-family:inherit;cursor:pointer;flex-shrink:0;font-weight:bold;}
.item-add-btn:hover{background:#22508a;}
.item-empty-hint{color:#ccc;font-style:italic;font-size:12px;padding:4px 0;}
/* ── テーマメモ カード ── */
.theme-list{display:flex;flex-direction:column;gap:8px;margin-bottom:4px;}
.theme-card{background:#f8faff;border:1px solid #c8d4e8;border-radius:6px;overflow:hidden;transition:opacity .15s;}
.theme-card.dragging{opacity:.4;box-shadow:0 4px 12px rgba(0,0,0,.2);}
.theme-card-hdr{display:flex;align-items:center;gap:6px;padding:5px 8px;background:#eef2ff;border-bottom:1px solid #d4dff5;}
.theme-card-title{flex:1;border:none;background:transparent;font-family:inherit;font-size:13px;font-weight:bold;color:#1a3c6e;outline:none;min-width:0;}
.theme-card-title:focus{background:#fff;border-radius:2px;padding:0 3px;}
.theme-card-title::placeholder{color:#bbb;font-weight:normal;}
.theme-card-body{width:100%;padding:8px 10px;border:none;font-family:inherit;font-size:13px;line-height:1.75;resize:vertical;background:transparent;color:#111;min-height:80px;display:block;}
.theme-card-body:focus{background:#fffde8;outline:none;}
.theme-card-del{background:none;border:none;color:#cc4444;font-size:16px;cursor:pointer;padding:2px 5px;flex-shrink:0;line-height:1;}
.theme-card-del:hover{color:#ff2222;}
.theme-add-btn{width:100%;margin-top:4px;}
/* ── Rendered text ── */

.rendered .empty{color:#ccc;font-style:italic;font-size:12px;padding:8px 0;}
.l0-num{font-size:11px;color:#aaa;min-width:22px;display:inline-block;text-align:right;margin-right:6px;}
/* ── テーマメモ 表示 ── */
.theme-view-item{padding-bottom:12px;margin-bottom:12px;border-bottom:1px solid #e0e0e0;}
.theme-view-item:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0;}
.theme-view-title{font-weight:bold;color:#1a3c6e;font-size:13.5px;margin-bottom:4px;padding-bottom:3px;border-bottom:1px solid #dde6f5;}
.theme-body-line{margin:0;padding:1px 0;line-height:1.75;}
/* ── Image cards (edit) ── */
.img-add-row{margin-bottom:8px;}
.img-add-btn{background:#1a3c6e;color:#fff;border:none;padding:8px 18px;border-radius:5px;font-size:13px;font-family:inherit;cursor:pointer;}
.img-add-btn:hover{background:#22508a;}
.img-list{display:flex;flex-direction:column;gap:6px;}
.img-card{display:flex;align-items:center;gap:8px;background:#f8faff;border:1px solid #c8d4e8;border-radius:6px;padding:6px 8px;transition:opacity .15s;}
.img-card.dragging{opacity:.4;box-shadow:0 4px 12px rgba(0,0,0,.2);}
.drag-handle{font-size:20px;color:#bbb;cursor:grab;padding:0 4px;touch-action:none;user-select:none;-webkit-user-select:none;flex-shrink:0;line-height:1;}
.drag-handle:active{cursor:grabbing;color:#888;}
.img-thumb{width:56px;height:46px;object-fit:cover;border-radius:3px;border:1px solid #ddd;flex-shrink:0;background:#eee;}
.img-card-title{flex:1;font-size:12px;color:#333;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;border:none;background:transparent;font-family:inherit;cursor:pointer;padding:1px 2px;border-radius:3px;}
.img-card-title:focus{outline:1.5px solid #1a3c6e;background:#fffde8;cursor:text;white-space:normal;}
.img-del{background:none;border:none;color:#cc4444;font-size:18px;cursor:pointer;padding:4px;flex-shrink:0;line-height:1;}
.img-del:hover{color:#ff2222;}
.img-empty-hint{color:#ccc;font-style:italic;font-size:12px;padding:6px 0;}
.img-uploading{color:#1a3c6e;font-size:12px;padding:6px 0;font-style:italic;}
/* ── ドロップゾーン ── */
.img-drop-zone{border:2px dashed #c8d4e8;border-radius:6px;padding:14px;text-align:center;color:#bbb;font-size:12px;margin-top:6px;transition:border-color .15s,background .15s;cursor:default;user-select:none;}
.img-drop-zone.drag-over{border-color:#1a3c6e;background:#eef3ff;color:#1a3c6e;}
/* ── Image view ── */
.mblk{margin-bottom:18px;}
.mtitle{font-size:12px;font-weight:bold;background:#fffbe8;padding:4px 10px;border-left:3px solid #d4a000;margin-bottom:6px;}
.mblk img{max-width:100%;border-radius:4px;border:1px solid #ddd;display:block;}
/* ── Mode control ── */
body.edit-mode .view-only{display:none!important;}
body.view-mode .edit-only{display:none!important;}
body.view-mode .note-block--empty{display:none!important;}
/* ── Mobile ── */
@media(max-width:600px){.subject-section{padding:10px 8px;}.nav-btn{padding:6px 3px;font-size:11px;min-width:40px;}}
/* ── Print ── */
@media print{
  @page{size:A4;margin:15mm 12mm 18mm 12mm;}
  body{font-size:9pt;line-height:1.6;color:#000!important;background:#fff!important;padding:0;}
  .toolbar,.sticky-nav,.save-ind,.edit-only{display:none!important;}
  .subject-section{display:block!important;padding:0;max-width:none;}
  .blk-body,.blk-body.col{display:block!important;}
  .subject-section{page-break-before:always;}
  .subject-section:first-of-type{page-break-before:auto;}
  .note-block{box-shadow:none;border:1px solid #bbb;margin-bottom:6pt;border-radius:0;break-inside:avoid;}
  .note-block--empty{display:none!important;}
  .blk-hdr{padding:4pt 8pt;font-size:10pt;}.blk-hdr .ti{display:none;}
  .subj-kankaku .blk-hdr{background:#2F5496!important;}.subj-kankyo .blk-hdr{background:#375623!important;}
  .subj-hokki   .blk-hdr{background:#833C00!important;}.subj-kozo   .blk-hdr{background:#7030A0!important;}
  .subj-seko    .blk-hdr{background:#1F3864!important;}.subj-images .blk-hdr{background:#7a5c00!important;}
  .subject-title{font-size:14pt;color:#000!important;border-bottom:2pt solid #000!important;}
  .rendered .l0{color:#000!important;}
  .theme-view-title{color:#000!important;border-color:#999!important;}
  .mblk{break-inside:avoid;}.mblk img{max-width:165mm;}
  .mtitle{background:#f5f5dc!important;}
  .item-add-row,.img-add-row,.img-empty-hint{display:none!important;}
  img{print-color-adjust:exact!important;-webkit-print-color-adjust:exact!important;}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
}
</style>
</head>
<body class="view-mode">
<div class="save-ind" id="saveInd">保存済み ✓</div>
<div class="toolbar">
  <button class="tb-btn btn-mode" id="modeBtn" onclick="toggleMode()">✏️ 入力</button>
  <button class="tb-btn btn-exp" onclick="exportData()">↓ バックアップ</button>
  <label class="tb-lbl btn-imp" style="flex:1;padding:9px 4px;border:none;border-radius:5px;font-size:12px;font-family:inherit;font-weight:bold;cursor:pointer;text-align:center;color:#fff;white-space:nowrap;background:#555;">↑ 復元<input type="file" accept=".json" onchange="importData(event)" style="display:none"></label>
</div>
<nav class="sticky-nav">
  <button class="nav-btn" data-id="kankaku" onclick="showSubj('kankaku',this)">計画</button>
  <button class="nav-btn" data-id="kankyo"  onclick="showSubj('kankyo',this)">環設</button>
  <button class="nav-btn" data-id="hokki"   onclick="showSubj('hokki',this)">法規</button>
  <button class="nav-btn" data-id="kozo"    onclick="showSubj('kozo',this)">構造</button>
  <button class="nav-btn" data-id="seko"    onclick="showSubj('seko',this)">施工</button>
  <button class="nav-btn img-tab" data-id="images" onclick="showSubj('images',this)">【画像】</button>
</nav>
<div id="content"></div>
<script>
'use strict';

// ── Firebase 初期化 ───────────────────────────────────
firebase.initializeApp({
  apiKey:            "AIzaSyAFlPk4rJNhYft4lc5TBM_b41x8P-v_Sss",
  authDomain:        "ikkyu2026-d1242.firebaseapp.com",
  projectId:         "ikkyu2026-d1242",
  storageBucket:     "ikkyu2026-d1242.firebasestorage.app",
  messagingSenderId: "771068476894",
  appId:             "1:771068476894:web:61fa9c2556c67349deb14f"
});
const fbDb = firebase.firestore();
let _syncBusy = false;

function notesRef()      { return fbDb.collection('hatsumi').doc('notes'); }
function imgDocRef(id)   { return fbDb.collection('hatsumi').doc('notes').collection('imgs').doc(id); }
function setSyncWidget() {}

async function syncToFirestore() {
  if (_syncBusy) return;
  // 安全チェック：Firestoreからロードされる前（_updatedAt未設定）は書き込み禁止
  if (!data._updatedAt) return;
  _syncBusy = true;
  try {
    data._updatedAt = Date.now();
    await notesRef().set({ subjects: data.subjects, imgMeta: data.imgMeta, _updatedAt: data._updatedAt });
    const el = document.getElementById('saveInd');
    if (el) { el.classList.add('show'); setTimeout(() => el.classList.remove('show'), 1400); }
  } catch (e) { console.error('Firestore write:', e); }
  _syncBusy = false;
}

async function uploadImgToFirestore(id, dataUrl) {
  await imgDocRef(id).set({ data: dataUrl, _updatedAt: Date.now() });
  await IDB.put(id, dataUrl);
}
async function fetchImgData(id) {
  const cached = await IDB.get(id);
  if (cached) return cached;
  try {
    const snap = await imgDocRef(id).get();
    if (snap.exists) { const url = snap.data().data; await IDB.put(id, url); return url; }
  } catch (e) { console.error('fetchImg:', e); }
  return null;
}
async function deleteImgFromFirestore(id) {
  try { await imgDocRef(id).delete(); } catch (e) { console.error('deleteImg:', e); }
  await IDB.del(id);
}

function startSync() {
  notesRef().onSnapshot(async snap => {
    if (!snap.exists) { await syncToFirestore(); return; }
    const remote = snap.data();
    const remoteTs = remote._updatedAt || 0, localTs = data._updatedAt || 0;
    if (remoteTs > localTs) {
      const remoteSubj = remote.subjects || {};
      // セクション保護：リモートが空でもローカルにデータがあるセクションは保持
      for (const s of SUBJECTS) {
        if (!remoteSubj[s]) remoteSubj[s] = {};
        for (const sec of SECTIONS) {
          const rv = remoteSubj[s][sec.id];
          const lv = (data.subjects[s] || {})[sec.id];
          if ((!Array.isArray(rv) || rv.length === 0) && Array.isArray(lv) && lv.length > 0) {
            remoteSubj[s][sec.id] = lv;
          }
        }
      }
      data.subjects = remoteSubj;
      data.imgMeta  = remote.imgMeta  || {};
      data._updatedAt = remoteTs;
      _needsCleanup = false;
      migrateData();
      localStorage.setItem(SKEY, JSON.stringify(data));
      await populateUI();
      if (_needsCleanup) syncToFirestore();
    }
  }, err => console.error('onSnapshot:', err));
}

// ── アプリ定数 ────────────────────────────────────────
const SUBJECTS = ['計画','環設','法規','構造','施工'];
const SUBJ_IDS = {計画:'kankaku',環設:'kankyo',法規:'hokki',構造:'kozo',施工:'seko'};
const SKEY = 'hatsumi';
const SECTIONS = [
  {id:'key',    icon:'📌', label:'キーポイント'},
  {id:'mis',    icon:'❌', label:'間違いノート'},
  {id:'themes', icon:'📖', label:'テーマメモ', type:'themelist'},
  {id:'mock',   icon:'📝', label:'模擬試験見直し'},
];

let data = {subjects:{}, imgMeta:{}};
let _needsCleanup = false; // 汚染データを検出した場合に即時Firestore保存

function _safeStr(v) {
  // 文字列以外 or "[object...]" のような誤変換は空文字に
  if (typeof v !== 'string') return '';
  if (/^\[object /.test(v)) { _needsCleanup = true; return ''; }
  return v;
}

function migrateData() {
  for (const s of SUBJECTS) {
    if (!data.subjects[s]) data.subjects[s] = {};
    for (const sec of SECTIONS) {
      const v = data.subjects[s][sec.id];
      if (sec.type === 'themelist') {
        // テーマメモ: [{title, body}] 配列
        if (typeof v === 'string') {
          data.subjects[s][sec.id] = v.trim() ? [{title: '', body: v}] : [];
        } else if (!Array.isArray(v)) {
          data.subjects[s][sec.id] = [];
        } else {
          data.subjects[s][sec.id] = v.map(item => {
            if (typeof item === 'string') return {title: '', body: _safeStr(item)};
            if (typeof item !== 'object' || item === null) return null;
            // {title, body} 正規形式
            if ('title' in item || 'body' in item)
              return {title: _safeStr(item.title), body: _safeStr(item.body)};
            // {t, h} 旧マーカー形式
            if ('t' in item) return {title: '', body: _safeStr(item.t)};
            return null;
          }).filter(Boolean);
        }
      } else if (!Array.isArray(v)) {
        data.subjects[s][sec.id] = typeof v === 'string' && v.trim()
          ? v.split('\n').map(l => l.trim()).filter(l => l) : [];
      } else {
        data.subjects[s][sec.id] = v.map(item =>
          typeof item === 'object' && item !== null ? (item.t || '') : String(item)
        ).filter(s => s.length > 0);
      }
    }
    if (!data.imgMeta[s]) data.imgMeta[s] = [];
  }
}

function loadData() {
  try { const s = localStorage.getItem(SKEY); if (s) data = JSON.parse(s); } catch {}
  migrateData();
}

let _saveT = null;
function schedSave() {
  if (_saveT) clearTimeout(_saveT);
  _saveT = setTimeout(() => { localStorage.setItem(SKEY, JSON.stringify(data)); syncToFirestore(); }, 800);
}

// ── IndexedDB ──────────────────────────────────────────
const IDB = (() => {
  let _db = null;
  async function open() {
    if (_db) return _db;
    return new Promise((ok, fail) => {
      const r = indexedDB.open('hatsumiimgs', 1);
      r.onupgradeneeded = e => e.target.result.createObjectStore('imgs');
      r.onsuccess = e => { _db = e.target.result; ok(_db); };
      r.onerror = fail;
    });
  }
  async function put(k, v) { await open(); return new Promise((ok, fail) => { const tx = _db.transaction('imgs','readwrite'); tx.objectStore('imgs').put(v, k); tx.oncomplete = ok; tx.onerror = fail; }); }
  async function get(k)    { await open(); return new Promise((ok, fail) => { const tx = _db.transaction('imgs','readonly');  const r = tx.objectStore('imgs').get(k); r.onsuccess = e => ok(e.target.result); r.onerror = fail; }); }
  async function del(k)    { await open(); return new Promise((ok, fail) => { const tx = _db.transaction('imgs','readwrite'); tx.objectStore('imgs').delete(k); tx.oncomplete = ok; tx.onerror = fail; }); }
  return {put, get, del};
})();

// ── UI 構築 ───────────────────────────────────────────
function buildUI() {
  const cont = document.getElementById('content');
  for (const s of SUBJECTS) {
    const sid = SUBJ_IDS[s];
    const div = document.createElement('div');
    div.id = sid; div.className = `subject-section subj-${sid}`;
    div.innerHTML = buildSubjHTML(s, sid);
    cont.appendChild(div);
  }
  const imgDiv = document.createElement('div');
  imgDiv.id = 'images'; imgDiv.className = 'subject-section subj-images';
  imgDiv.innerHTML = buildImgTabHTML();
  cont.appendChild(imgDiv);
}

function buildSubjHTML(subj, sid) {
  const label = subj === '環設' ? '環境設備' : subj;
  let h = `<h1 class="subject-title">${label}</h1>`;
  for (const sec of SECTIONS) {
    const eid = `${sid}-${sec.id}`;
    let editBody;
    if (sec.type === 'themelist') {
      editBody = `<div class="theme-list" id="${eid}-tlist" data-subj="${subj}"></div>
        <button class="item-add-btn theme-add-btn" onclick="addTheme('${subj}')">＋ テーマを追加</button>`;
    } else {
      editBody = `<div class="item-list" id="${eid}-list" data-subj="${subj}" data-field="${sec.id}"></div>
        <div class="item-add-row">
          <input class="item-input" id="${eid}-input" type="text" placeholder=""
            onkeydown="if(event.key==='Enter'){event.preventDefault();addItemFromInput('${subj}','${sec.id}',this);}">
          <button class="item-add-btn" onclick="addItemFromInput('${subj}','${sec.id}',document.getElementById('${eid}-input'))">追加</button>
        </div>`;
    }
    h += `<div class="note-block">
  <div class="blk-hdr" onclick="toggleBlk(this)">${sec.icon} ${sec.label} <span class="ti">▼</span></div>
  <div class="blk-body col">
    <div class="edit-only">${editBody}</div>
    <div class="view-only rendered" id="${eid}-v"></div>
  </div></div>`;
  }
  return h;
}

function buildImgTabHTML() {
  let h = `<h1 class="subject-title">📊 まとめ画像</h1>`;
  for (const s of SUBJECTS) {
    const sid = SUBJ_IDS[s];
    h += `<div class="note-block">
  <div class="blk-hdr" onclick="toggleBlk(this)">${s} <span class="ti">▼</span></div>
  <div class="blk-body col">
    <div class="edit-only">
      <div class="img-add-row">
        <button class="img-add-btn" onclick="triggerAdd('${s}')">＋ 画像を追加</button>
        <input type="file" accept="image/*" multiple id="img-input-${sid}" style="display:none" onchange="onImgAdd(this,'${s}')">
      </div>
      <div class="img-drop-zone" id="img-drop-${sid}" data-subj="${s}">ここに画像をドロップして追加</div>
      <div class="img-list" id="img-list-${sid}" data-subj="${s}"></div>
    </div>
    <div class="view-only" id="img-view-${sid}"></div>
  </div></div>`;
  }
  return h;
}

// ── ユーティリティ ────────────────────────────────────
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function setEl(id, html) { const el = document.getElementById(id); if (el) el.innerHTML = html; }

// ── アイテムリスト（キーポイント・間違いノート・模擬試験）──
function renderItemList(subj, field) {
  const sid = SUBJ_IDS[subj];
  const list = document.getElementById(`${sid}-${field}-list`);
  if (!list) return;
  const items = data.subjects[subj][field] || [];
  list.innerHTML = '';
  if (!items.length) { list.innerHTML = '<div class="item-empty-hint">（まだ項目がありません）</div>'; return; }
  items.forEach((text, i) => {
    const row = document.createElement('div');
    row.className = 'item-row'; row.dataset.idx = i;
    row.innerHTML = `<div class="drag-handle">⠿</div>
      ${field === 'key' ? `<span class="item-num">${i + 1}</span>` : ''}
      <input class="item-txt-input" type="text" value="${esc(text)}"
        data-subj="${esc(subj)}" data-field="${esc(field)}" data-idx="${i}"
        onblur="onItemBlur(this)" onkeydown="onItemKeydown(event,this)">
      <button class="item-del-btn" onclick="delItem('${esc(subj)}','${esc(field)}',${i})">✕</button>`;
    list.appendChild(row);
  });
}

function syncViewMode(subj, field) {
  const sid = SUBJ_IDS[subj];
  // テーマメモ
  if (field === 'themes') {
    const themes = data.subjects[subj]['themes'] || [];
    const html = themes.length
      ? themes.map(t => {
          const title = typeof t.title === 'string' ? t.title : '';
          const body  = typeof t.body  === 'string' ? t.body  : '';
          const bodyHtml = body.split('\n')
            .map(l => `<div class="theme-body-line">${l ? esc(l) : '&nbsp;'}</div>`).join('');
          return `<div class="theme-view-item">
            ${title.trim() ? `<div class="theme-view-title">${esc(title)}</div>` : ''}
            <div>${bodyHtml}</div>
          </div>`;
        }).join('')
      : '<div class="empty">（まだ入力がありません）</div>';
    setEl(`${sid}-themes-v`, html);
    const tlist = document.getElementById(`${sid}-themes-tlist`);
    if (tlist) { const b = tlist.closest('.note-block'); if (b) b.classList.toggle('note-block--empty', themes.length === 0); }
    return;
  }
  // 通常アイテムリスト
  const items = data.subjects[subj][field] || [];
  const html = items.length
    ? items.map((t, i) => field === 'key'
        ? `<div class="l0"><span class="l0-num">${i + 1}.</span>${esc(t)}</div>`
        : `<div class="l0">${esc(t)}</div>`
      ).join('')
    : '<div class="empty">（まだ入力がありません）</div>';
  setEl(`${sid}-${field}-v`, html);
  const listEl = document.getElementById(`${sid}-${field}-list`);
  if (listEl) { const b = listEl.closest('.note-block'); if (b) b.classList.toggle('note-block--empty', items.length === 0); }
}

function addItemFromInput(subj, field, inputEl) {
  const text = inputEl.value.trim(); if (!text) return;
  if (!Array.isArray(data.subjects[subj][field])) data.subjects[subj][field] = [];
  data.subjects[subj][field].push(text);
  inputEl.value = ''; renderItemList(subj, field); syncViewMode(subj, field); schedSave(); inputEl.focus();
}

function onItemBlur(el) {
  const subj = el.dataset.subj, field = el.dataset.field, idx = parseInt(el.dataset.idx);
  const newText = el.value.trim();
  if (!newText) { el.value = data.subjects[subj][field][idx] || ''; return; }
  if (data.subjects[subj][field][idx] !== newText) { data.subjects[subj][field][idx] = newText; syncViewMode(subj, field); schedSave(); }
}

function onItemKeydown(e, el) {
  if (e.key === 'Enter')  { e.preventDefault(); el.blur(); }
  if (e.key === 'Escape') { el.value = data.subjects[el.dataset.subj][el.dataset.field][parseInt(el.dataset.idx)] || ''; el.blur(); }
}

function delItem(subj, field, idx) {
  data.subjects[subj][field].splice(idx, 1); renderItemList(subj, field); syncViewMode(subj, field); schedSave();
}

// ── テーマメモ ────────────────────────────────────────
function renderThemeList(subj) {
  const sid = SUBJ_IDS[subj];
  const tlist = document.getElementById(`${sid}-themes-tlist`);
  if (!tlist) return;
  const themes = data.subjects[subj]['themes'] || [];
  tlist.innerHTML = '';
  themes.forEach((theme, i) => {
    const safeTitle = typeof theme.title === 'string' ? theme.title : '';
    const safeBody  = typeof theme.body  === 'string' ? theme.body  : '';
    const card = document.createElement('div');
    card.className = 'theme-card'; card.dataset.idx = i;
    card.innerHTML = `
      <div class="theme-card-hdr">
        <div class="drag-handle">⠿</div>
        <input class="theme-card-title" type="text" value="${esc(safeTitle)}" placeholder="タイトル（任意）"
          data-subj="${esc(subj)}" data-idx="${i}"
          onblur="onThemeTitleBlur(this)" onkeydown="if(event.key==='Enter')event.preventDefault()">
        <button class="theme-card-del" onclick="delTheme('${esc(subj)}',${i})">✕</button>
      </div>
      <textarea class="theme-card-body" data-subj="${esc(subj)}" data-idx="${i}"
        oninput="onThemeBodyInput(this)"></textarea>`;
    card.querySelector('.theme-card-body').value = safeBody;
    tlist.appendChild(card);
  });
}

function addTheme(subj) {
  if (!Array.isArray(data.subjects[subj]['themes'])) data.subjects[subj]['themes'] = [];
  data.subjects[subj]['themes'].push({title: '', body: ''});
  renderThemeList(subj); syncViewMode(subj, 'themes'); schedSave();
  // 新しいカードのテキストエリアにフォーカス
  const sid = SUBJ_IDS[subj];
  const tlist = document.getElementById(`${sid}-themes-tlist`);
  if (tlist) { const cards = tlist.querySelectorAll('.theme-card'); if (cards.length) cards[cards.length-1].querySelector('.theme-card-body')?.focus(); }
}

function delTheme(subj, idx) {
  if (!confirm('このテーマを削除しますか？')) return;
  (data.subjects[subj]['themes'] || []).splice(idx, 1);
  renderThemeList(subj); syncViewMode(subj, 'themes'); schedSave();
}

function onThemeTitleBlur(el) {
  const subj = el.dataset.subj, idx = parseInt(el.dataset.idx);
  const theme = (data.subjects[subj]['themes'] || [])[idx]; if (!theme) return;
  theme.title = el.value;
  syncViewMode(subj, 'themes'); schedSave();
}

function onThemeBodyInput(el) {
  const subj = el.dataset.subj, idx = parseInt(el.dataset.idx);
  const theme = (data.subjects[subj]['themes'] || [])[idx]; if (!theme) return;
  theme.body = el.value;
  syncViewMode(subj, 'themes'); schedSave();
}

// ── 画像処理 ──────────────────────────────────────────
function triggerAdd(subj) { document.getElementById(`img-input-${SUBJ_IDS[subj]}`).click(); }

async function processImgFile(file, subj) {
  const rawTitle = file.name.replace(/\.[^.]+$/, '');
  const title = prompt('画像のタイトルを入力してください', rawTitle);
  if (title === null) return;
  const sid = SUBJ_IDS[subj];
  const list = document.getElementById(`img-list-${sid}`);
  if (list) list.innerHTML = '<div class="img-uploading">アップロード中...</div>';
  const dataUrl = await resizeImg(file);
  const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  await uploadImgToFirestore(id, dataUrl);
  data.imgMeta[subj].push({id, title: title.trim() || rawTitle});
  await syncToFirestore(); await renderImgCards(subj); await renderImgView(subj);
  if (list) { const body = list.closest('.blk-body'); if (body && body.classList.contains('col')) { body.classList.remove('col'); const ti = body.previousElementSibling.querySelector('.ti'); if (ti) ti.textContent = '▲'; } }
}

async function onImgAdd(input, subj) { for (const file of input.files) await processImgFile(file, subj); input.value = ''; }

async function resizeImg(file) {
  return new Promise(ok => {
    const img = new Image(), reader = new FileReader();
    reader.onload = e => { img.onload = () => { const MAX=1200; let w=img.width,h=img.height; if(w>MAX||h>MAX){if(w>h){h=Math.round(h*MAX/w);w=MAX;}else{w=Math.round(w*MAX/h);h=MAX;}} const c=document.createElement('canvas'); c.width=w;c.height=h; c.getContext('2d').drawImage(img,0,0,w,h); ok(c.toDataURL('image/jpeg',.85)); }; img.src=e.target.result; }; reader.readAsDataURL(file);
  });
}

async function onImgTitleBlur(el) {
  const id=el.dataset.imgid,subj=el.dataset.subj,newTitle=el.value.trim();
  const meta=(data.imgMeta[subj]||[]).find(m=>m.id===id); if(!meta) return;
  if(!newTitle){el.value=meta.title;return;}
  if(meta.title!==newTitle){meta.title=newTitle;await syncToFirestore();await renderImgView(subj);}
}

async function delImg(subj, id) {
  if(!confirm('この画像を削除しますか？')) return;
  await deleteImgFromFirestore(id); data.imgMeta[subj]=data.imgMeta[subj].filter(m=>m.id!==id);
  await syncToFirestore(); await renderImgCards(subj); await renderImgView(subj);
}

async function renderImgCards(subj) {
  const sid=SUBJ_IDS[subj],list=document.getElementById(`img-list-${sid}`); if(!list) return;
  list.innerHTML=''; const meta=data.imgMeta[subj]||[];
  if(!meta.length){list.innerHTML='<div class="img-empty-hint">（まだ画像がありません）</div>';return;}
  for(const m of meta){
    const card=document.createElement('div'); card.className='img-card'; card.dataset.id=m.id;
    card.innerHTML=`<div class="drag-handle">⠿</div><img class="img-thumb" src="" alt="" data-imgid="${esc(m.id)}">
      <input class="img-card-title" type="text" value="${esc(m.title)}" data-imgid="${esc(m.id)}" data-subj="${esc(subj)}"
        onblur="onImgTitleBlur(this)" onkeydown="if(event.key==='Enter')this.blur()">
      <button class="img-del" onclick="delImg('${subj}','${m.id}')">✕</button>`;
    list.appendChild(card);
    fetchImgData(m.id).then(url=>{if(url){const el=card.querySelector(`[data-imgid="${m.id}"]`);if(el)el.src=url;}});
  }
}

async function renderImgView(subj) {
  const sid=SUBJ_IDS[subj],view=document.getElementById(`img-view-${sid}`); if(!view) return;
  const meta=data.imgMeta[subj]||[];
  if(!meta.length){view.innerHTML='<div class="empty rendered">（まだ画像がありません）</div>';return;}
  view.innerHTML=meta.map(m=>`<div class="mblk"><div class="mtitle">${esc(m.title)}</div><img src="" data-imgid="${esc(m.id)}" alt="${esc(m.title)}"></div>`).join('');
  for(const m of meta) fetchImgData(m.id).then(url=>{if(url)view.querySelectorAll(`[data-imgid="${m.id}"]`).forEach(el=>el.src=url);});
}

// ── ドロップゾーン ────────────────────────────────────
function initImgDropZones() {
  document.querySelectorAll('.img-drop-zone').forEach(zone => {
    const subj = zone.dataset.subj;
    zone.addEventListener('dragenter', e => { e.preventDefault(); zone.classList.add('drag-over'); });
    zone.addEventListener('dragover',  e => { e.preventDefault(); e.dataTransfer.dropEffect='copy'; });
    zone.addEventListener('dragleave', e => { if(!zone.contains(e.relatedTarget)) zone.classList.remove('drag-over'); });
    zone.addEventListener('drop', async e => {
      e.preventDefault(); zone.classList.remove('drag-over');
      for(const file of [...e.dataTransfer.files].filter(f=>f.type.startsWith('image/'))) await processImgFile(file,subj);
    });
  });
}

// ── 並び替えドラッグ＆ドロップ ────────────────────────
let _drag=null,_dragMoved=false,_dragY0=0,_dragList=null,_dragCtx=null;

function initDragDrop() {
  document.addEventListener('pointerdown', e => {
    const handle = e.target.closest('.drag-handle'); if(!handle) return;
    const imgCard   = handle.closest('.img-card');
    const itemRow   = handle.closest('.item-row');
    const themeCard = handle.closest('.theme-card');
    _drag = imgCard || itemRow || themeCard; if(!_drag) return;
    _dragList = _drag.parentNode;
    _dragCtx = imgCard   ? {type:'img',   subj: _dragList.dataset.subj}
             : themeCard ? {type:'theme', subj: _dragList.dataset.subj}
             :             {type:'item',  subj: _dragList.dataset.subj, field: _dragList.dataset.field};
    _dragY0=e.clientY; _dragMoved=false; e.preventDefault();
  });

  document.addEventListener('pointermove', e => {
    if(!_drag) return;
    if(!_dragMoved){if(Math.abs(e.clientY-_dragY0)<5) return; _dragMoved=true; _drag.classList.add('dragging');}
    e.preventDefault();
    _drag.style.pointerEvents='none';
    const under=document.elementFromPoint(e.clientX,e.clientY);
    _drag.style.pointerEvents='';
    const cls=_dragCtx.type==='img'?'.img-card':_dragCtx.type==='theme'?'.theme-card':'.item-row';
    const target=under?.closest(cls);
    if(target&&target!==_drag&&target.parentNode===_dragList){
      const r=target.getBoundingClientRect();
      _dragList.insertBefore(_drag, e.clientY>r.top+r.height/2?target.nextSibling:target);
    }
  },{passive:false});

  document.addEventListener('pointerup', () => {
    if(!_drag) return;
    _drag.classList.remove('dragging');
    if(_dragMoved&&_dragCtx){
      if(_dragCtx.type==='img'){
        const ids=[..._dragList.querySelectorAll('.img-card')].map(c=>c.dataset.id);
        const map={}; (data.imgMeta[_dragCtx.subj]||[]).forEach(m=>map[m.id]=m);
        data.imgMeta[_dragCtx.subj]=ids.map(id=>map[id]).filter(Boolean);
        schedSave(); renderImgView(_dragCtx.subj);
      } else if(_dragCtx.type==='theme'){
        const cards=[..._dragList.querySelectorAll('.theme-card')];
        const old=data.subjects[_dragCtx.subj]['themes']||[];
        data.subjects[_dragCtx.subj]['themes']=cards.map(c=>old[parseInt(c.dataset.idx)]).filter(Boolean);
        schedSave(); renderThemeList(_dragCtx.subj); syncViewMode(_dragCtx.subj,'themes');
      } else {
        const rows=[..._dragList.querySelectorAll('.item-row')];
        const old=data.subjects[_dragCtx.subj][_dragCtx.field]||[];
        data.subjects[_dragCtx.subj][_dragCtx.field]=rows.map(r=>old[parseInt(r.dataset.idx)]).filter(s=>s!==undefined);
        schedSave(); renderItemList(_dragCtx.subj,_dragCtx.field); syncViewMode(_dragCtx.subj,_dragCtx.field);
      }
    }
    _drag=null; _dragMoved=false; _dragList=null; _dragCtx=null;
  });

  document.addEventListener('pointercancel', () => { if(_drag){_drag.classList.remove('dragging');_drag=null;} });
}

// ── UI 操作 ───────────────────────────────────────────
function showSubj(id, btn) {
  document.querySelectorAll('.subject-section').forEach(e=>e.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(e=>e.classList.remove('active'));
  document.getElementById(id).classList.add('active'); btn.classList.add('active');
  localStorage.setItem('lastTabHatsumi', id); window.scrollTo({top:0,behavior:'instant'});
}

function toggleBlk(hdr) {
  const body=hdr.nextElementSibling; const col=body.classList.toggle('col');
  hdr.querySelector('.ti').textContent=col?'▼':'▲';
}

let isEdit=false;
function toggleMode() {
  isEdit=!isEdit;
  document.body.className=isEdit?'edit-mode':'view-mode';
  document.getElementById('modeBtn').textContent=isEdit?'👁 表示':'✏️ 入力';
  document.querySelectorAll('.blk-body.col').forEach(body=>{
    body.classList.remove('col');
    const ti=body.previousElementSibling?.querySelector('.ti'); if(ti) ti.textContent='▲';
  });
}

// ── データ投入 ────────────────────────────────────────
async function populateUI() {
  for(const s of SUBJECTS){
    const sid=SUBJ_IDS[s];
    for(const sec of SECTIONS){
      if(sec.type==='themelist') renderThemeList(s);
      else renderItemList(s, sec.id);
      syncViewMode(s, sec.id);
    }
  }
  for(const s of SUBJECTS){ await renderImgCards(s); await renderImgView(s); }
}

// ── バックアップ / 復元 ───────────────────────────────
async function exportData() {
  const imgData = {};
  for (const s of SUBJECTS) {
    imgData[s] = [];
    for (const m of (data.imgMeta[s] || [])) {
      // IDBキャッシュになければFirestoreからも取得
      const d = await fetchImgData(m.id);
      imgData[s].push({...m, data: d || null});
    }
  }
  const out = {v: 4, subjects: data.subjects, imgMeta: data.imgMeta, imgData, ts: Date.now()};
  const blob = new Blob([JSON.stringify(out)], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  Object.assign(document.createElement('a'), {
    href: url, download: `勉強ノート2026_${new Date().toISOString().slice(0,10)}.json`
  }).click();
  URL.revokeObjectURL(url);
}

async function importData(ev) {
  const file = ev.target.files[0]; if (!file) return;
  try {
    const imp = JSON.parse(await file.text());
    data.subjects = imp.subjects || {};
    data.imgMeta  = imp.imgMeta  || {};
    migrateData();
    if (imp.imgData) {
      for (const s of SUBJECTS)
        for (const m of (imp.imgData[s] || []))
          // IDBキャッシュ＋Firestoreサブコレクション両方に保存
          if (m.id && m.data) await uploadImgToFirestore(m.id, m.data);
    }
    data._updatedAt = Date.now();
    localStorage.setItem(SKEY, JSON.stringify(data));
    await syncToFirestore();
    await populateUI();
    alert('復元しました ✓');
  } catch (err) { alert('読み込みに失敗しました: ' + err.message); }
  ev.target.value = '';
}

// ── 起動 ─────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', async () => {
  loadData(); buildUI(); initImgDropZones(); initDragDrop();
  await IDB.get('__init__'); await populateUI();
  const last=localStorage.getItem('lastTabHatsumi')||'kankaku';
  const btn=document.querySelector(`[data-id="${last}"]`); if(btn) showSubj(last,btn);
  startSync();
});
</script>
